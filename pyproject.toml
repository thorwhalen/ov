[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ov"
version = "0.1.0"
description = "OverView of a web app"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["web", "capture", "playwright", "ux", "accessibility", "reverse-engineering", "agent"]
authors = [{ name = "Thor Whalen" }]
dependencies = [
    "pydantic>=2",
    "dol",
    "argh",
    "playwright",
    "httpx",        # raw-fetch for the rendering-model (JS-disabled) diff
    "genson",       # per-endpoint JSON Schema merge across journey samples
    "selectolax",   # fast, dependency-light HTML parsing for the analyzers
]

[project.license]
text = "mit"

[project.scripts]
ov = "ov.__main__:main"

[project.urls]
Homepage = "https://github.com/thorwhalen/ov"
Repository = "https://github.com/thorwhalen/ov"
Documentation = "https://thorwhalen.github.io/ov"

[project.optional-dependencies]
# Evidence-bundle image marking / set-of-mark overlay (Phase 3).
evidence = ["pillow"]
# Optional dataflow DAG backend for the registries (a minimal topo-sort is built in).
dag = ["meshed"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.0"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = ["3.10", "3.12"]
pytest_args = ["-v", "--tb=short"]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = ["term", "xml"]
exclude_paths = ["examples", "scrap"]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
# Auto-publish to PyPI on merge to main (wads norm). The version is auto-bumped
# from the max across sources (git tag / PyPI / pyproject) then patch-incremented,
# so it never regresses; the push-back of the bump uses the repo's SSH deploy key.
# Use `[bump minor]` / `[bump major]` in a commit message for a larger bump, or
# `[skip ci]` to skip a publish.
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = ["tests/", "scrap/", "examples/"]
